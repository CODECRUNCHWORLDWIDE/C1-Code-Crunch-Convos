repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--strict]
        # This package has no runtime dependencies, so there is nothing to add.
        # The key still appears because it is the line people forget: the mypy
        # hook runs in its own isolated virtualenv and cannot see the packages
        # your project installed, so every third-party import your code makes
        # has to be listed here or mypy reports it as missing.
        additional_dependencies: []
