{% extends "base.html" %}
{% block title %}New post — Crunch Blog{% endblock %}

{% block content %}
  <h1>New post</h1>
  <form method="post">
    <label for="title">Title</label>
    <input id="title" name="title" required value="{{ request.form['title'] or '' }}">

    <label for="body">Body</label>
    <textarea id="body" name="body" rows="10">{{ request.form['body'] or '' }}</textarea>

    <button type="submit">Publish</button>
  </form>
{% endblock %}
