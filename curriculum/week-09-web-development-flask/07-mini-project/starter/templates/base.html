<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}My Blog{% endblock %} · Code Crunch Worldwide</title>
    <!-- cc-seo:start (managed) -->
    <link rel="canonical" href="https://codecrunchglobal.vercel.app/GITHUB-ORG-CODECRUNCHWORLDWIDE/C1-Code-Crunch-Convos/curriculum/week-09-web-development-flask/07-mini-project/starter/templates/base">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <meta name="author" content="Code Crunch Worldwide">
    <meta name="theme-color" content="#2463EB">
    <meta name="keywords" content="Code Crunch, Code Crunch Worldwide, coding community, learn to code, tech community, coding workshops, technical interview prep, hackathons">
    <meta name="description" content="Code Crunch Worldwide is a global tech community — no-cost coding workshops, technical-interview prep, project-based learning, and hackathons, open to everyone.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Code Crunch Worldwide">
    <meta property="og:title" content="{% block title %}My Blog{% endblock %} · Code Crunch Worldwide">
    <meta property="og:description" content="Code Crunch Worldwide is a global tech community — no-cost coding workshops, technical-interview prep, project-based learning, and hackathons, open to everyone.">
    <meta property="og:url" content="https://codecrunchglobal.vercel.app/GITHUB-ORG-CODECRUNCHWORLDWIDE/C1-Code-Crunch-Convos/curriculum/week-09-web-development-flask/07-mini-project/starter/templates/base">
    <meta property="og:image" content="https://codecrunchglobal.vercel.app/codecrunchworldwide-brand-assets/codecrunchworldwide-official-logo.png">
    <meta property="og:image:alt" content="Code Crunch Worldwide">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block title %}My Blog{% endblock %} · Code Crunch Worldwide">
    <meta name="twitter:description" content="Code Crunch Worldwide is a global tech community — no-cost coding workshops, technical-interview prep, project-based learning, and hackathons, open to everyone.">
    <meta name="twitter:image" content="https://codecrunchglobal.vercel.app/codecrunchworldwide-brand-assets/codecrunchworldwide-official-logo.png">
    <!-- cc-seo:end -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header>
      <h1><a href="{{ url_for('index') }}">My Blog</a></h1>
      <nav>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('new_post') }}">New post</a>
      </nav>
    </header>

    <main>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <ul class="flashes">
            {% for category, message in messages %}
              <li class="flash flash-{{ category }}">{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>

    <footer>
      <small>Built with Flask &middot; Week 9, Code Crunch Convos</small>
    </footer>
  </body>
</html>
